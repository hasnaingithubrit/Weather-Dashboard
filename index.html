<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(15, 23, 42, 0.78);
            --primary: #38bdf8;
            --secondary: #e2e8f0;
            --text: #f8fafc;
            --muted: #cbd5e1;
            --shadow: rgba(15, 23, 42, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 35%),
                linear-gradient(135deg, #020817, #0f172a 45%, #111827);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .app {
            width: min(1100px, 100%);
            background: var(--panel);
            border: 1px solid rgba(148, 163, 184, 0.25);
            backdrop-filter: blur(12px);
            border-radius: 22px;
            box-shadow: 0 25px 80px var(--shadow);
            padding: 28px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .title {
            font-size: clamp(1.5rem, 2vw, 2.5rem);
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.8);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 1rem;
            width: min(300px, 50vw);
        }

        .search-box input::placeholder {
            color: var(--muted);
        }

        .search-box button {
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: white;
            padding: 11px 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-box button:hover {
            opacity: 0.9;
        }

        .weather-card {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 22px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.88), rgba(15, 23, 42, 0.95));
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .location {
            font-size: 0.95rem;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .temp-row {
            display: flex;
            align-items: end;
            gap: 12px;
            flex-wrap: wrap;
        }

        .degree {
            font-size: clamp(2.8rem, 7vw, 5.2rem);
            font-weight: 800;
            line-height: 1;
        }

        .condition {
            margin-top: 12px;
            font-size: 1.1rem;
            color: var(--secondary);
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(150px, 1fr));
            gap: 14px;
            margin-top: 22px;
        }

        .meta-item {
            background: rgba(15, 23, 42, 0.65);
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .meta-label {
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 4px;
        }

        .meta-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
        }

        .mini-card {
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 16px;
            padding: 18px;
        }

        .mini-card h3 {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .mini-value {
            font-size: 1.9rem;
            font-weight: 700;
        }

        .forecast-section {
            margin-top: 22px;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
            margin-top: 12px;
        }

        .day-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 16px;
            padding: 14px;
            min-height: 150px;
        }

        .day-date {
            font-size: 0.82rem;
            color: var(--muted);
        }

        .day-temp {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 12px 0 4px;
        }

        .day-condition {
            color: var(--secondary);
        }

        .hourly-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .hour-card {
            background: rgba(15, 23, 42, 0.72);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            text-align: center;
        }

        .hour-time {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .hour-temp {
            font-size: 1.15rem;
            font-weight: 700;
            margin-top: 8px;
        }

        .error {
            color: #fca5a5;
            margin-top: 14px;
            min-height: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        @media (max-width: 700px) {
            .weather-card {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="topbar">
            <div class="title">🌤️ Weather Dashboard</div>

            <form class="search-box" id="searchForm">
                <input id="cityInput" type="text" placeholder="Search city..." value="Karachi">
                <button type="submit">Search</button>
            </form>
        </div>

        <div id="weatherCard" class="weather-card">
            <div>
                <div class="location" id="locationText">Loading...</div>

                <div class="temp-row">
                    <div class="degree" id="currentTemp">--°</div>
                    <div class="condition" id="currentCondition">Loading...</div>
                </div>

                <div class="meta">
                    <div class="meta-item">
                        <div class="meta-label">Feels like</div>
                        <div class="meta-value" id="feelsLike">--°</div>
                    </div>

                    <div class="meta-item">
                        <div class="meta-label">Humidity</div>
                        <div class="meta-value" id="humidity">--%</div>
                    </div>

                    <div class="meta-item">
                        <div class="meta-label">Wind</div>
                        <div class="meta-value" id="wind">-- km/h</div>
                    </div>

                    <div class="meta-item">
                        <div class="meta-label">Rain chance</div>
                        <div class="meta-value" id="rainChance">--%</div>
                    </div>
                </div>
            </div>

            <div class="side-panel">
                <div class="mini-card">
                    <h3>Sunrise</h3>
                    <div class="mini-value" id="sunrise">--:--</div>
                </div>

                <div class="mini-card">
                    <h3>Sunset</h3>
                    <div class="mini-value" id="sunset">--:--</div>
                </div>

                <div class="mini-card">
                    <h3>Timezone</h3>
                    <div class="mini-value" id="timezone">--</div>
                </div>
            </div>
        </div>

        <div class="error" id="errorMessage"></div>

        <div class="forecast-section">
            <h2>📅 7-Day Forecast</h2>
            <div id="forecastDays" class="forecast-grid"></div>

            <h2 style="margin-top: 24px;">⏰ Next 6 Hours</h2>
            <div id="hourlyForecast" class="hourly-row"></div>
        </div>
    </div>

    <script>
        const weatherApi = "https://api.open-meteo.com/v1/forecast";
        const geocodeApi = "https://geocoding-api.open-meteo.com/v1/search";

        const locationText = document.getElementById("locationText");
        const currentTemp = document.getElementById("currentTemp");
        const currentCondition = document.getElementById("currentCondition");
        const feelsLike = document.getElementById("feelsLike");
        const humidity = document.getElementById("humidity");
        const wind = document.getElementById("wind");
        const rainChance = document.getElementById("rainChance");
        const sunrise = document.getElementById("sunrise");
        const sunset = document.getElementById("sunset");
        const timezone = document.getElementById("timezone");
        const errorMessage = document.getElementById("errorMessage");
        const forecastDays = document.getElementById("forecastDays");
        const hourlyForecast = document.getElementById("hourlyForecast");
        const cityInput = document.getElementById("cityInput");
        const form = document.getElementById("searchForm");

        function weatherCodeToText(code) {
            const codes = {
                0: "Clear sky ☀️",
                1: "Mostly clear 🌤️",
                2: "Partly cloudy ⛅",
                3: "Overcast ☁️",
                45: "Fog 🌫️",
                48: "Depositing rime fog",
                51: "Light drizzle 🌧️",
                53: "Moderate drizzle 🌧️",
                55: "Heavy drizzle 🌧️",
                61: "Light rain 🌧️",
                63: "Moderate rain 🌧️",
                65: "Heavy rain ⛈️",
                71: "Light snow ❄️",
                73: "Moderate snow ❄️",
                75: "Heavy snow ❄️",
                80: "Rain showers 🌧️",
                81: "Heavy showers ⛈️",
                82: "Violent showers ⛈️",
                85: "Snow showers ❄️",
                86: "Heavy snow showers ❄️",
                95: "Thunderstorm ⚡",
                96: "Thunderstorm with hail ⚡",
                99: "Severe thunderstorm ⚡"
            };

            return codes[code] || "Unknown";
        }

        function formatDay(dateStr) {
            return new Date(dateStr).toLocaleDateString(undefined, {
                weekday: "short",
                month: "short",
                day: "numeric"
            });
        }

        function formatTime(dateStr) {
            return new Date(dateStr).toLocaleTimeString(undefined, {
                hour: "numeric",
                minute: "2-digit"
            });
        }

        function formatHour(dateStr) {
            return new Date(dateStr).toLocaleTimeString(undefined, {
                hour: "numeric",
                minute: "2-digit"
            });
        }

        async function getWeather(city) {
            errorMessage.textContent = "";
            try {
                const geocodeRes = await fetch(
                    `${geocodeApi}?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
                );

                if (!geocodeRes.ok) {
                    throw new Error("Could not find that city.");
                }

                const geocodeData = await geocodeRes.json();
                const cityData = geocodeData.results?.[0];

                if (!cityData) {
                    throw new Error("City not found. Try another location.");
                }

                const params = new URLSearchParams({
                    latitude: cityData.latitude,
                    longitude: cityData.longitude,
                    current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m",
                    hourly: "temperature_2m,precipitation_probability,weather_code",
                    daily: "weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max",
                    timezone: "auto",
                    forecast_days: 7
                });

                const forecastRes = await fetch(`${weatherApi}?${params.toString()}`);

                if (!forecastRes.ok) {
                    throw new Error("Weather API request failed.");
                }

                const weatherData = await forecastRes.json();
                renderWeather(cityData, weatherData);
            } catch (err) {
                errorMessage.textContent = "❌ " + (err.message || "Something went wrong.");
            }
        }

        function renderWeather(cityData, weatherData) {
            const current = weatherData.current;
            const hourly = weatherData.hourly;
            const daily = weatherData.daily;

            locationText.textContent = `📍 ${cityData.name}, ${cityData.country}`;
            currentTemp.textContent = `${Math.round(current.temperature_2m)}°C`;
            currentCondition.textContent = weatherCodeToText(current.weather_code);
            feelsLike.textContent = `${Math.round(current.apparent_temperature)}°C`;
            humidity.textContent = `${Math.round(current.relative_humidity_2m)}%`;
            wind.textContent = `${Math.round(current.wind_speed_10m)} km/h`;
            rainChance.textContent = `${Math.round(daily.precipitation_probability_max[0])}%`;

            sunrise.textContent = formatTime(daily.sunrise[0]);
            sunset.textContent = formatTime(daily.sunset[0]);
            timezone.textContent = weatherData.timezone || "UTC";

            forecastDays.innerHTML = "";
            daily.time.forEach((date, index) => {
                const dayCard = document.createElement("div");
                dayCard.className = "day-card";

                const maxTemp = Math.round(daily.temperature_2m_max[index]);
                const minTemp = Math.round(daily.temperature_2m_min[index]);
                const condition = weatherCodeToText(daily.weather_code[index]);

                dayCard.innerHTML = `
                    <div class="day-date">${formatDay(date)}</div>
                    <div class="day-temp">${maxTemp}° / ${minTemp}°</div>
                    <div class="day-condition">${condition}</div>
                `;

                forecastDays.appendChild(dayCard);
            });

            hourlyForecast.innerHTML = "";
            for (let i = 0; i < 6; i++) {
                const hourCard = document.createElement("div");
                hourCard.className = "hour-card";

                const time = hourly.time[i];
                const temp = Math.round(hourly.temperature_2m[i]);
                const cond = weatherCodeToText(hourly.weather_code[i]);

                hourCard.innerHTML = `
                    <div class="hour-time">${formatHour(time)}</div>
                    <div class="hour-temp">${temp}°C</div>
                    <div class="day-condition">${cond}</div>
                `;

                hourlyForecast.appendChild(hourCard);
            }
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const city = cityInput.value.trim();
            if (!city) {
                errorMessage.textContent = "❌ Please enter a city name.";
                return;
            }
            getWeather(city);
        });

        getWeather("Karachi");
    </script>
</body>
</html>
